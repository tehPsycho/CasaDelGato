<!doctype html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Contact / Inquiry</title><link rel='stylesheet' href='styles.css'></head><body><main class='container'><section class='section'><h2>Ask Matt About an Antique</h2><div class='side-layout'><form class='card'><div class='card-body'><div class='grid'><p><label for='name'>Name</label><input id='name' required></p><p><label for='email'>Email</label><input id='email' type='email' required></p><p><label for='phone'>Phone (optional)</label><input id='phone'></p><p><label for='subject'>Subject</label><input id='subject'></p></div><p><label for='type'>Type of item</label><select id='type'><option>Silver / Flatware</option><option>Pottery</option><option>Glass</option><option>Furniture</option><option>Art / Decor</option><option>Unknown / Other</option></select></p><p><label for='age'>Approximate age if known</label><input id='age'></p><p><label for='found'>Where did you find it?</label><input id='found'></p><p><label for='desc'>Description</label><textarea id='desc'></textarea></p><p><label for='marks'>Markings / signatures / stamps</label><textarea id='marks'></textarea></p><p><label for='imgs'>Upload images</label><input id='imgs' type='file' multiple accept='image/*'></p><p><label><input type='checkbox' required> I understand this is an informal inquiry and not a formal appraisal.</label></p><button class='btn primary' type='submit'>Submit Inquiry</button><p><small><!-- TODO: wire upload storage + email routing when backend workflow is approved. --></small></p></div></form><aside class='card'><div class='card-body'><h3>How to photograph your antique</h3><ul><li>Front</li><li>Back</li><li>Bottom/base</li><li>Close-up of marks</li><li>Damage or repair areas</li><li>Scale reference</li></ul></div></aside></div></section></main><script src='app.js'></script><script>bootstrap('contact');document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();alert('Thanks! Inquiry submission is a UI placeholder for now.');});</script></body></html>
