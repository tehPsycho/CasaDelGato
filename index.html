<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CasaDelGato</title>
    <meta name="description" content="CasaDelGato listings explorer" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>CasaDelGato</h1>
      <p>Shop curated finds from CasaDelGato.</p>
    </header>

    <main class="container">
      <section class="controls">
        <input id="searchInput" type="search" placeholder="Search listings..." aria-label="Search listings" />
        <select id="categorySelect" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </section>

      <section id="results" class="grid" aria-live="polite"></section>
      <p id="emptyState" class="empty hidden">No listings match your filters.</p>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <img class="card-image" alt="" loading="lazy" />
        <div class="card-body">
          <h2 class="card-title"></h2>
          <p class="card-category"></p>
          <p class="card-price"></p>
          <a class="card-link" target="_blank" rel="noopener noreferrer">View listing</a>
        </div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
