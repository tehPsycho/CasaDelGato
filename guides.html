<!doctype html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Identification Guides</title><link rel='stylesheet' href='styles.css'></head><body><main class='container'><section class='section'><h2>Identification Guides</h2><p>Inspect construction, marks, wear patterns, and materials. Photograph front/back/base, close-ups of signatures, damage, and scale references.</p><p><!-- TODO Matt: refine demand and pattern notes with current market research. --></p><div class='tabs' id='tabs'></div><div id='panels'></div></section></main><script src='app.js'></script><script>bootstrap('id');const categories=['Silverplate & Flatware','Pottery & Art Pottery','Depression Glass','Furniture & Wood','Art Deco','Mid-Century Modern','Hollywood Regency','Decorative Oddities']; tabs.innerHTML=categories.map((c,i)=>`<button class='tab-btn ${i===0?'active':''}' data-i='${i}'>${c}</button>`).join(''); panels.innerHTML=categories.map((c,i)=>`<section class='tab-panel ${i===0?'active':''}'><div class='grid'><article class='card'><div class='card-body'><h3>${c} Overview</h3><p>General profile, common periods, and collector context.</p><h4>Key features</h4><ul><li>Construction and wear consistency</li><li>Marks/signatures and stamp style</li><li>Material clues and finishing</li></ul><h4>Reproduction warnings</h4><p>Watch for artificial aging, incorrect hardware, and mismatched marks.</p><h4>Research checklist</h4><ul><li>Document all marks exactly.</li><li>Take sharp detail photos.</li><li>Compare catalog references.</li></ul></div></article><article class='card'>${ph(c+' reference 1')}<div class='card-body'>Placeholder example image.</div></article><article class='card'>${ph(c+' reference 2')}<div class='card-body'>Placeholder marks/construction close-up.</div></article></div></section>`).join('');document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active',i==b.dataset.i));});</script></body></html>
