<!doctype html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Shop Listings</title><link rel='stylesheet' href='styles.css'></head><body><main class='container'><section class='section'><h2>Shop Listings</h2><div class='side-layout'><aside class='filters card'><div class='card-body'><label>Search</label><input id='q' placeholder='Search titles, style, category'><label>Category</label><select id='cat'><option value='all'>All</option></select><label>Period/style</label><select id='style'><option value='all'>All</option></select><label>Material</label><select id='mat'><option value='all'>All</option></select><label>Condition</label><select id='feat'><option value='all'>All</option><option value='featured'>Featured only</option></select></div></aside><section><div id='chips'></div><div id='results' class='grid'></div></section></div></section></main><script src='app.js'></script><script>bootstrap('shop'); const cats=[...new Set(listingMockData.map(x=>x.category))],styles=[...new Set(listingMockData.map(x=>x.style))],mats=[...new Set(listingMockData.map(x=>x.material))]; for(const [id,arr] of [['cat',cats],['style',styles],['mat',mats]]) arr.forEach(v=>document.getElementById(id).insertAdjacentHTML('beforeend',`<option>${v}</option>`)); document.getElementById('chips').innerHTML=cats.map(c=>`<span class='tag'>${c}</span>`).join(''); function render(){const q=qv.value.toLowerCase(),c=cat.value,s=style.value,m=mat.value,f=feat.value;const list=listingMockData.filter(i=>(i.title+i.category+i.style).toLowerCase().includes(q)&&(c==='all'||i.category===c)&&(s==='all'||i.style===s)&&(m==='all'||i.material===m)&&(f==='all'||i.featured)); results.innerHTML=list.map(i=>`<article class='card'>${ph(i.title)}<div class='card-body'><h3>${i.title}</h3><p><span class='tag'>${i.category}</span> <span class='tag'>${i.style}</span></p><p>${i.condition}. Material: ${i.material}.</p><p><strong>${i.price}</strong></p><a class='btn alt' target='_blank' href='${EBAY_URL}'>View on eBay</a></div></article>`).join('')||'<p>No listings match your filters.</p>';} const [qv,cat,style,mat,feat,results]=['q','cat','style','mat','feat','results'].map(id=>document.getElementById(id)); [qv,cat,style,mat,feat].forEach(el=>el.addEventListener('input',render)); render();</script></body></html>
